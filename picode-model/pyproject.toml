[project]
name = "picode"
version = "0.1.0"
description = "PyTorch steganography framework for encoding/decoding hidden messages in images"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchmetrics>=1.0",
    "click>=8.0",
    "pillow>=10.0",
    "pyldpc>=0.7.9",
    "galois>=0.4.0",
    "pyyaml>=6.0",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-benchmark>=4.0",
    "ruff",
    "mypy",
    "types-PyYAML",
    "tensorboard>=2.0",
    "kornia>=0.7.0",
]
kornia = [
    "kornia>=0.7.0",
]
lpips = [
    "lpips>=0.1",
]
export-ios = [
    # no native coremltools build for Python 3.14+ yet; export from a 3.13 environment
    "coremltools>=7.0; python_version < '3.14'",
]
export-android = [
    "ai-edge-torch>=0.1.0",
    "tensorflow>=2.15.0",
]
export = [
    "picode[export-ios,export-android]",
]
all = [
    "picode[dev,lpips,kornia,export]",
]

[project.scripts]
picode = "picode.cli:main"
distort = "picode.distortions.cli:main"
picode-train = "picode.training.cli:main"
detect = "picode.detection.cli:main"
detect-export = "picode.detection.export.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["picode*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "picode.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["picode/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
