# PicoTrust b7238s20p00d00 + Sobel mask in training
#
# No blur at all (d00, p00). Instead, Sobel texture mask applied to
# the residual during training. The mask directly enforces content-
# adaptivity — encoder learns to concentrate in textured regions.
#
# Hypothesis: Sobel mask replaces blur for content-adaptivity.
# The encoder gets direct spatial feedback instead of indirect
# perceptual pressure from blurred LPIPS.

experiment_name: picotrust_b7238s20p00d00_sobel

model:
  type: picotrust
  encoder_size: 512
  decoder_size: 512

data:
  source: folder
  path: ./data/train
  batch_size: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 72
  image_size: 512
  warmup_steps: 500
  no_im_loss_steps: 10000
  generator_grad_clip: 0.25
  stn_lr_scale: 0.01
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000
  phase2_step: 60000
  phase2_decoder_lr_scale: 0.1
  residual_strength: 1.0
  residual_strength_anneal_target: 0.020
  residual_strength_anneal_start: 10000
  residual_strength_anneal_steps: 90000
  anneal_schedule: exponential
  decoder_blur_sigma: 0.0
  perceptual_blur_sigma: 0.0
  use_sobel_mask: true
  sobel_blur_sigma: 5.0
  sobel_mask_floor: 0.85

loss:
  message:
    scale: 5.0
    ramp_steps: 1
  l2:
    scale: 1.5
    ramp_steps: 50000
  lpips:
    scale: 1.5
    ramp_steps: 50000
  ffl:
    scale: 1.0
    ramp_steps: 50000
    delay_steps: 0
  message_loss_type: mse
  l2_edge_gain: 0.0
  use_border_falloff: true
  gan_config:
    enabled: true
    discriminator_lr: 0.000015
    g_loss_scale: 1.5
    g_loss_ramp_steps: 20000

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
