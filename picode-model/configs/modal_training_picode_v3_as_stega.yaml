# Same as modal_training.yaml but with picode_v3 model
experiment_name: picode_v3_as_stega

model: picode_v3

data:
  source: folder
  path: /data/train2017
  batch_size: 4
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 127  # Only difference: 127 vs 100
  image_size: 400
  warmup_steps: 2000  # Same as StegaStamp

loss:
  message:
    scale: 1.0  # Same as StegaStamp
    ramp_steps: 1
  l2:
    scale: 1.5
    ramp_steps: 20000
  lpips:
    scale: 1.0
    ramp_steps: 20000

distortion:
  strategy: curriculum  # Same as StegaStamp
  perspective:
    strength: 0.1
    ramp_steps: 20000
  brightness:
    strength: 0.3
    ramp_steps: 10000
  saturation:
    strength: 1.0
    ramp_steps: 10000
  hue:
    strength: 0.1
    ramp_steps: 10000
  noise:
    strength: 0.02
    ramp_steps: 10000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 10000
  jpeg_quality:
    strength: 25
    ramp_steps: 15000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: /checkpoints
  save_every_steps: 5000
  keep_last: 5

logging:
  backends: [console, tensorboard]
  log_every_steps: 50
  tensorboard_dir: /checkpoints/runs
