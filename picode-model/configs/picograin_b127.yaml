experiment_name: picograin_b127

model:
  type: picograin
  encoder_size: 512
  decoder_size: 512

data:
  source: folder
  path: ./data/train
  batch_size: 4

training:
  num_steps: 120000
  lr: 0.0001
  num_bits: 127
  image_size: 512
  warmup_steps: 500
  no_im_loss_steps: 1000
  generator_grad_clip: 0.25
  stn_lr_scale: 0.01
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000
  phase2_step: 80000
  phase2_decoder_lr_scale: 0.1
  residual_strength: 0.10

loss:
  message:
    scale: 5.0
    ramp_steps: 1
  l2:
    scale: 1.5
    ramp_steps: 50000
  lpips:
    scale: 1.5
    ramp_steps: 50000
  # NOTE: no FFL. Focal Frequency Loss penalises per-frequency reconstruction
  # error, which directly targets the high-frequency grain we want to keep.
  message_loss_type: mse
  l2_edge_gain: 0.0
  use_border_falloff: true
  # Grain-aware losses. L2/LPIPS above are computed on blurred images so they
  # constrain colour and structure without suppressing the grain texture.
  grain:
    structure_blur_sigma: 2.0
    lum_floor: 0.1
    lum_fidelity:
      scale: 1.0
      ramp_steps: 50000
    envelope_tv:
      scale: 0.5
      ramp_steps: 50000
  # GAN disabled for run 1: the noise carrier is already N(0,1) scaled by the
  # luminance mask, so grain statistics are film-like by construction. The
  # grain discriminator needs a real-grain data source that does not exist yet.
  gan_config:
    enabled: false

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
