# PicoTrust b31 COCO print-to-photo — 31 bits, BCH(31,16), strength 0.020
#
# Supersedes picotrust_b31_coco_compositing.yaml, which targeted s=0.012.
# Measured on the MIR Flickr b31 checkpoint (50 images, combo capture gate):
#   s=0.020 -> 49/50 BCH   s=0.015 -> 44/50   s=0.012 -> 33/50
# This model does not scale down; train at the strength it will be used at.
#
# Changes from picotrust_b31_compositing (the validated run):
#   - COCO train2017 instead of MIR Flickr
#   - print-to-photo distortions enabled (they were all None before)
#
# ECC: BCH(31,16), hard decision. Measured equal to soft-decision LDPC at this
# block length and simpler — see docs/wisdom.md.

experiment_name: picotrust_b31_coco_print

model:
  type: picotrust
  encoder_size: 512
  decoder_size: 512

data:
  source: folder
  path: ./data/train
  batch_size: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 31
  image_size: 512
  warmup_steps: 500
  no_im_loss_steps: 10000
  generator_grad_clip: 0.25
  stn_lr_scale: 0.01
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000
  phase2_step: 60000
  phase2_decoder_lr_scale: 0.1

  # Strength: anneal to 0.020, the level this architecture actually holds up at.
  residual_strength: 1.0
  residual_strength_anneal_target: 0.020
  residual_strength_anneal_start: 10000
  residual_strength_anneal_steps: 90000
  anneal_schedule: exponential

  # No blur anywhere — the Sobel mask supplies content-adaptivity.
  decoder_blur_sigma: 0.0
  perceptual_blur_sigma: 0.0
  use_sobel_mask: true
  sobel_blur_sigma: 5.0
  sobel_mask_floor: 0.85
  sobel_mask_floor_anneal_target: 0.40
  sobel_mask_floor_anneal_start: 10000
  sobel_mask_floor_anneal_steps: 90000

  # Compositing: validated at 49/50 through the combo gate.
  use_compositing: true
  compositing_ratio_target: 0.5
  compositing_ratio_ramp_start: 10000
  compositing_ratio_ramp_steps: 50000
  compositing_scale_min: 0.50
  compositing_scale_max: 0.95
  compositing_crop_jitter: 0.08

loss:
  message:
    scale: 5.0
    ramp_steps: 1
  l2:
    scale: 3.0
    ramp_steps: 50000
  lpips:
    scale: 1.5
    ramp_steps: 50000
  ffl:
    scale: 2.0
    ramp_steps: 50000
    delay_steps: 0
  message_loss_type: mse
  l2_edge_gain: 0.0
  use_border_falloff: true
  gan_config:
    enabled: true
    discriminator_lr: 0.000015
    g_loss_scale: 1.5
    g_loss_ramp_steps: 20000

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

  # Print-to-photo chain. Off in every previous b31 run despite being
  # implemented and wired. Ramped over 30k steps so they phase in well after
  # bootstrap rather than destabilising it. Values are deliberately mild.
  resolution_loss:      # scale = 1 - strength, so 0.35 -> capture at 65%
    strength: 0.35
    ramp_steps: 30000
  shot_noise:           # sensor noise, brightness-dependent
    strength: 0.04
    ramp_steps: 30000
  barrel_distortion:    # lens radial warp, k in +/- strength
    strength: 0.08
    ramp_steps: 30000
  vignetting:           # uneven illumination on the print
    strength: 0.25
    ramp_steps: 30000
  chromatic_aberration: # per-channel shift as fraction of width
    strength: 0.002
    ramp_steps: 30000

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
