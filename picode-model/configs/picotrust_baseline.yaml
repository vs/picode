experiment_name: picotrust_baseline

model:
  type: picotrust
  encoder_size: 256
  decoder_size: 256

data:
  source: folder
  path: ./data/train
  batch_size: 8          # Smaller images -> larger batch

training:
  num_steps: 200000
  lr: 0.0001
  num_bits: 100
  image_size: 256
  warmup_steps: 500
  no_im_loss_steps: 500
  generator_grad_clip: 0.25
  stn_lr_scale: 0.01
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000

loss:
  message:
    scale: 5.0            # Must dominate image losses at full ramp
    ramp_steps: 1
  l2:
    scale: 1.5            # StegaStamp default
    ramp_steps: 20000
  lpips:
    scale: 1.0            # StegaStamp default
    ramp_steps: 20000
  yuv_weights: [1, 1, 1]  # No chrominance penalty
  ffl:
    scale: 1.0            # TrustMark enhancement
    ramp_steps: 20000
    delay_steps: 20000
  message_loss_type: mse       # MSE avoids trivial 0.5 collapse that BCE allows
  use_border_falloff: true  # StegaStamp default
  gan_config:
    enabled: true           # TrustMark enhancement
    discriminator_lr: 0.00001
    g_loss_scale: 1.0
    g_loss_ramp_steps: 20000

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
