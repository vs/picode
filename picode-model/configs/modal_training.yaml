# configs/modal_training.yaml
# Configuration for Modal GPU training with COCO dataset
# GPU options: T4 ($0.59/hr), A10G ($1.10/hr), A100 ($3.50/hr)

experiment_name: picode_coco

data:
  source: folder
  path: /data/train2017  # COCO train2017 images
  batch_size: 4  # T4 (16GB) - increase to 8 for A10G, 16 for A100
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 100
  image_size: 400
  warmup_steps: 2000
  no_im_loss_steps: 500  # Original: 500 steps message-only training
  generator_grad_clip: 0.25  # Original: clips to [-0.25, 0.25]

loss:
  message:
    scale: 1.0
    ramp_steps: 1
  l2:
    scale: 1.5
    ramp_steps: 20000
  lpips:
    scale: 1.0
    ramp_steps: 20000

  # Border falloff (original StegaStamp approach)
  use_border_falloff: true
  border_falloff_speed: 4
  l2_edge_gain: 10.0
  l2_edge_ramp_steps: 20000
  l2_edge_delay_steps: 60000

  yuv_weights: [1.0, 1.0, 1.0]

  # GAN enabled with original hyperparameters
  gan_config:
    enabled: true
    discriminator_lr: 0.00001  # Original: 1e-5
    g_loss_scale: 1.0  # Original: 1.0
    g_loss_ramp_steps: 20000
    clip_weights: 0.01  # Original: 0.01

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 20000
  brightness:
    strength: 0.3
    ramp_steps: 10000
  saturation:
    strength: 1.0
    ramp_steps: 10000
  hue:
    strength: 0.1
    ramp_steps: 10000
  noise:
    strength: 0.02
    ramp_steps: 10000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 10000
  jpeg_quality:
    strength: 25
    ramp_steps: 15000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: /checkpoints  # Modal volume mount point
  save_every_steps: 5000  # More frequent saves for cloud
  keep_last: 5

logging:
  backends: [console, tensorboard]
  log_every_steps: 50  # More frequent logging to observe progress
  tensorboard_dir: /checkpoints/runs  # Persistent on Modal volume
