# picode_v2 training configuration
# Mobile-optimized decoder with artifact-reducing encoder
# Includes FFL and GAN training for reduced visual artifacts

experiment_name: picode_v2_baseline

model: picode_v2

data:
  source: folder
  path: ./data/train
  batch_size: 4
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 100
  image_size: 400
  warmup_steps: 500
  residual_scale: 1.0  # Strong signal like StegaStamp (0.3 was too weak)

loss:
  message:
    scale: 7.0  # Higher weight to prioritize message recovery (was 1.0)
    ramp_steps: 1
  l2:
    scale: 1.5
    ramp_steps: 20000
  lpips:
    scale: 1.0
    ramp_steps: 20000

  # Focal Frequency Loss - reduces frequency-domain artifacts
  # Timeline: delay 20k steps, then ramp 20k→60k steps
  ffl:
    scale: 0.1
    ramp_steps: 40000
    delay_steps: 20000

  # GAN generator loss weight
  # Timeline: delay 30k steps, then ramp 30k→80k steps
  gan:
    scale: 0.01
    ramp_steps: 50000
    delay_steps: 30000

  # GAN training configuration
  gan_config:
    enabled: true
    discriminator_lr: 0.0004  # 4x higher than generator LR
    lambda_gp: 10.0           # Gradient penalty weight for WGAN-GP
    n_critic: 1               # Discriminator updates per generator update

distortion:
  strategy: curriculum

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
  tensorboard_dir: runs
