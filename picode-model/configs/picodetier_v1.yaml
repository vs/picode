experiment_name: picodetier_v1

model:
  type: picodetier
  encoder_size: 512
  decoder_size: 256

data:
  source: folder
  path: ./data/train
  batch_size: 4

training:
  num_bits: 96
  num_steps: 200000
  lr: 0.0001
  image_size: 512
  warmup_steps: 500
  no_im_loss_steps: 10000
  generator_grad_clip: 0.25
  stn_lr_scale: 0.01
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000
  phase2_step: 60000
  phase2_decoder_lr_scale: 0.1
  residual_strength: 1.0
  residual_strength_anneal_start: 10000
  residual_strength_anneal_steps: 80000
  residual_strength_anneal_target: 1.0

loss:
  message: { scale: 5.0, ramp_steps: 1 }
  tier_classifier: { scale: 1.0, ramp_steps: 1 }
  l2: { scale: 1.5, ramp_steps: 50000 }
  lpips: { scale: 1.5, ramp_steps: 50000 }
  ffl: { scale: 1.0, ramp_steps: 50000, delay_steps: 30000 }
  message_loss_type: mse
  use_border_falloff: true
  l2_edge_gain: 0.0
  gan_config:
    enabled: true
    discriminator_lr: 0.000015
    g_loss_scale: 1.5
    g_loss_ramp_steps: 20000

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
