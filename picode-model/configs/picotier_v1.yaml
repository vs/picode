# PicoTier v1 — 4-tier model with split decoder/perceptual blur
#
# Based on PicoTrust v14/v15 techniques: 512→512 decoder, exponential annealing,
# decoder-side blur (original + blur(residual)), blurred LPIPS/GAN for
# content-adaptive gradients, L2/FFL on real encoded image.
#
# Split blur design (from v14-v20 experiments):
#   - decoder_blur_sigma: per-tier, controls spatial frequency band for decoder
#   - perceptual_blur_sigma: per-tier, controls content-adaptivity
#   - Higher decoder σ = lower-frequency residuals = more invisible (UHQ)
#   - Lower decoder σ = finer spatial patterns = more capacity (LQ)
#   - σ > 1.0 for LPIPS creates diagonal artifacts — capped at 1.0
#
# Tiers (defined in picode/models/picotier/tiers.py):
#   UHQ: 30 bits, strength 0.008, dec σ=1.0, perc σ=1.0 → LDPC(30,17) = 17 data bits
#   HQ:  48 bits, strength 0.010, dec σ=0.7, perc σ=0.7 → LDPC(48,26) = 26 data bits
#   MQ:  72 bits, strength 0.012, dec σ=0.5, perc σ=0.5 → LDPC(72,38) = 38 data bits
#   LQ:  96 bits, strength 0.014, dec σ=0.3, perc σ=0.5 → LDPC(96,50) = 50 data bits

experiment_name: picotier_v1

model:
  type: picotier
  encoder_size: 512
  decoder_size: 512

data:
  source: folder
  path: ./data/train
  batch_size: 4

training:
  num_bits: 96
  num_steps: 200000
  lr: 0.0001
  image_size: 512
  warmup_steps: 500
  no_im_loss_steps: 10000
  generator_grad_clip: 0.25
  stn_lr_scale: 0.01
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000
  phase2_step: 60000
  phase2_decoder_lr_scale: 0.1
  residual_strength: 1.0
  residual_strength_anneal_start: 10000
  residual_strength_anneal_steps: 120000
  residual_strength_anneal_target: 1.0
  anneal_schedule: exponential

loss:
  message: { scale: 5.0, ramp_steps: 1 }
  tier_classifier: { scale: 1.0, ramp_steps: 1 }
  l2: { scale: 1.5, ramp_steps: 50000 }
  lpips: { scale: 1.5, ramp_steps: 50000 }
  ffl: { scale: 1.0, ramp_steps: 50000, delay_steps: 0 }
  message_loss_type: mse
  l2_edge_gain: 0.0
  use_border_falloff: true
  gan_config:
    enabled: true
    discriminator_lr: 0.000015
    g_loss_scale: 1.5
    g_loss_ramp_steps: 20000

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
