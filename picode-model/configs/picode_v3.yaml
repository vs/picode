# Picode v3 training configuration
# Imperceptibility-first steganography with BCH error correction
#
# Key design decisions:
# - StegaStamp architecture adapted for 127-bit BCH codewords
# - Light distortions (print-scan scenario at mild intensities)
# - Lower message loss weight (ECC handles imperfect recovery)
# - 5k step message ramp (allows perceptual losses to establish clean baseline)
#
# BCH(127, 50): 50-bit payload, corrects up to 13 errors (~10.2%)
# Training uses random 127-bit strings; BCH encoding/decoding at inference only.

experiment_name: picode_v3_light_distortion

model: picode_v3

data:
  source: folder
  path: ./data/train
  batch_size: 4
  num_workers: 4
  # gradient_accumulation_steps: 1  # Increase if batch_size 4 exceeds GPU memory

training:
  num_steps: 100000
  lr: 0.0001
  num_bits: 127  # BCH codeword length (NOT payload size)
  image_size: 400
  warmup_steps: 500

loss:
  # Message loss: must be active from start to avoid local minimum
  # where encoder outputs zero residual (no message encoding)
  message:
    scale: 1.0
    ramp_steps: 1

  # Pixel-level fidelity (StegaStamp default)
  l2:
    scale: 1.5
    ramp_steps: 20000

  # Perceptual similarity (StegaStamp default)
  lpips:
    scale: 1.0
    ramp_steps: 20000

# Light distortions for print-scan at mild intensities
# Applied probabilistically: Color → Blur → Noise → Geometric → JPEG
distortion:
  strategy: fixed_light

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
  tensorboard_dir: runs
