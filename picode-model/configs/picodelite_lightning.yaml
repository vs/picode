# PicodeLite Configuration for Lightning.ai Studio
# YUV fix: penalize chrominance shifts to eliminate green/magenta artifacts
# Free tier: 80 GPU-hours/month, T4/L4/A100 available
# Storage: 50GB persistent in /teamspace/studios/this_studio

experiment_name: picodelite_v2

model:
  type: picodelite
  encoder_size: 512
  decoder_size: 512

data:
  source: folder
  # Lightning.ai persistent storage path
  path: /teamspace/studios/this_studio/data/train2017
  batch_size: 4  # T4 (16GB) safe, increase to 8 for L4/A100
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 63  # BCH(63, 36)
  image_size: 512
  warmup_steps: 2000
  no_im_loss_steps: 2000
  borders: image
  rnd_trans: 0.10  # Match StegaStamp (no STN to correct)
  rnd_trans_ramp: 20000

loss:
  message:
    scale: 1.0
    ramp_steps: 1
  message_loss_type: bce
  l2:
    scale: 2.0
    ramp_steps: 10000
  lpips:
    scale: 1.5
    ramp_steps: 10000
  use_border_falloff: false
  border_falloff_speed: 4
  l2_edge_gain: 10.0
  l2_edge_ramp_steps: 20000
  l2_edge_delay_steps: 60000
  yuv_weights: [1.0, 100.0, 100.0]
  gan_config:
    enabled: false
    discriminator_lr: 0.00001
    g_loss_scale: 1.0
    g_loss_ramp_steps: 20000
    clip_weights: 0.01
    gradient_clip: 0.25

distortion:
  strategy: curriculum
  perspective:
    strength: 0.15  # Stronger than StegaStamp
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  # Lightning.ai persistent storage
  dir: /teamspace/studios/this_studio/checkpoints
  save_every_steps: 5000
  keep_last: 5

logging:
  backends: [console, tensorboard]
  log_every_steps: 50
  tensorboard_dir: /teamspace/studios/this_studio/checkpoints/runs
