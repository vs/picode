# PicoMposite v1 — 4-tier model with per-tier decoder blur
#
# Tiers (defined in picode/models/picomposite/tiers.py):
#   UHQ: 30 bits, strength 0.010, blur σ=1.4 → LDPC(30,17) = 17 data bits
#   HQ:  48 bits, strength 0.012, blur σ=1.0 → LDPC(48,26) = 26 data bits
#   MQ:  72 bits, strength 0.016, blur σ=0.8 → LDPC(72,38) = 38 data bits
#   LQ:  96 bits, strength 0.020, blur σ=0.6 → LDPC(96,50) = 50 data bits

experiment_name: picomposite_v1

model:
  type: picomposite
  encoder_size: 512
  decoder_size: 416

data:
  source: folder
  path: ./data/train
  batch_size: 4

training:
  num_bits: 96
  num_steps: 200000
  lr: 0.0001
  image_size: 512
  warmup_steps: 500
  no_im_loss_steps: 10000
  generator_grad_clip: 0.25
  stn_lr_scale: 0.01
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000
  phase2_step: 60000
  phase2_decoder_lr_scale: 0.1
  residual_strength: 1.0
  residual_strength_anneal_start: 10000
  residual_strength_anneal_steps: 120000
  residual_strength_anneal_target: 1.0
  anneal_schedule: exponential

loss:
  message: { scale: 5.0, ramp_steps: 1 }
  tier_classifier: { scale: 1.0, ramp_steps: 1 }
  l2: { scale: 1.5, ramp_steps: 50000 }
  lpips: { scale: 1.5, ramp_steps: 50000 }
  ffl: { scale: 1.0, ramp_steps: 50000, delay_steps: 30000 }
  message_loss_type: mse
  gan_config:
    enabled: true
    discriminator_lr: 0.000015
    g_loss_scale: 1.5
    g_loss_ramp_steps: 20000

distortion:
  strategy: curriculum

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
