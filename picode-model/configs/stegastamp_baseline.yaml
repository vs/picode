# configs/stegastamp_baseline.yaml
# Baseline configuration matching StegaStamp defaults

experiment_name: stegastamp_baseline

data:
  source: folder
  path: ./data/train
  batch_size: 4
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 100  # Original uses 100 bits
  image_size: 400
  warmup_steps: 500
  no_im_loss_steps: 500  # Original: 500
  generator_grad_clip: 0.25  # Original: clips to [-0.25, 0.25]
  borders: black  # Original: black borders for out-of-frame regions
  rnd_trans: 0.1  # Original: 0.1 max perspective translation
  rnd_trans_ramp: 10000  # Original: 10000 steps to ramp up perspective

loss:
  message:
    scale: 1.0  # Original: 1.0
    ramp_steps: 1
  message_loss_type: bce
  l2:
    scale: 1.5  # Original: 1.5
    ramp_steps: 15000  # Original: 15000
  lpips:
    scale: 1.0  # Original: 1.0
    ramp_steps: 15000  # Original: 15000

  # Border falloff (original StegaStamp approach)
  use_border_falloff: true
  border_falloff_speed: 4
  l2_edge_gain: 10.0
  l2_edge_ramp_steps: 10000  # Original: 10000
  l2_edge_delay_steps: 60000  # Original: 60000

  yuv_weights: [1.0, 1.0, 1.0]  # Original: equal weights (Y=1, U=1, V=1)
  gan_config:
    enabled: true
    discriminator_lr: 0.00001  # Original: 1e-5
    g_loss_scale: 1.0  # Original: 1.0
    g_loss_ramp_steps: 15000  # Original: 15000
    clip_weights: 0.01  # Original: 0.01
    gradient_clip: 0.25  # Original: clips D gradients to [-0.25, 0.25]

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
  tensorboard_dir: runs
