# configs/stegastamp_baseline.yaml
# Baseline configuration matching StegaStamp defaults

experiment_name: stegastamp_baseline

data:
  source: folder
  path: ./data/train
  batch_size: 4
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 100  # Original uses 100 bits
  image_size: 400
  warmup_steps: 500
  no_im_loss_steps: 1500  # Original: 1500

loss:
  message:
    scale: 1.5  # Original: 1.5 (not 7.0)
    ramp_steps: 1
  message_loss_type: bce
  l2:
    scale: 2.0  # Original: 2.0 (not 1.0)
    ramp_steps: 15000  # Original: 15000
  lpips:
    scale: 1.5  # Original: 1.5
    ramp_steps: 15000  # Original: 15000
  l2_edge_gain: 10.0
  l2_edge_ramp_steps: 10000  # Original: 10000
  l2_edge_delay_steps: 80000  # Original: 80000
  yuv_weights: [1.0, 100.0, 100.0]  # Original: Y=1, U=100, V=100

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
  tensorboard_dir: runs
