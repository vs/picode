experiment_name: picodeframe_baseline

model:
  type: picodeframe
  encoder_size: 400
  decoder_size: 400

data:
  source: folder
  path: ./data/train
  batch_size: 4
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 127
  image_size: 400
  warmup_steps: 5000      # Long warmup: message-only, no distortions (frame signal is thin)
  no_im_loss_steps: 10000  # Image losses start well after message path is established
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 20000    # Slow perspective ramp (starts after warmup)

frame:
  min_frame_pct: 0.02
  max_frame_pct: 0.05
  fixed_frame_steps: 20000  # Use max_frame_pct for first N steps, then randomize
  frame_l2_scale: 1.0       # Reduced — let encoder encode more aggressively
  frame_l2_ramp_steps: 1
  frame_lpips_scale: 0.5    # Reduced — prioritize message over frame quality
  frame_lpips_ramp_steps: 10000
  frame_color_scale: 0.0    # Disabled — single-channel residual guarantees greyscale
  frame_color_ramp_steps: 10000
  stn_reg_scale: 0.1

loss:
  message:
    scale: 7.0
    ramp_steps: 1         # No ramp — full gradient from step 0 (border signal needs max strength)
  message_loss_type: bce
  gan_config:
    enabled: false

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 20000   # Slow ramp (counted from warmup end)
  brightness:
    strength: 0.3
    ramp_steps: 10000
  saturation:
    strength: 1.0
    ramp_steps: 10000
  hue:
    strength: 0.1
    ramp_steps: 10000
  noise:
    strength: 0.02
    ramp_steps: 10000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 10000
  jpeg_quality:
    strength: 25
    ramp_steps: 10000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: checkpoints
  save_every_steps: 10000
  keep_last: 3

logging:
  backends: [console, tensorboard]
  log_every_steps: 100
