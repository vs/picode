# PicodeLite 256-bit Kaggle Configuration
# Same as picodelite_kaggle.yaml but with 256-bit message length

experiment_name: picodelite_256bit

model:
  type: picodelite
  encoder_size: 512
  decoder_size: 512

data:
  source: folder
  path: ./data/train  # Overridden at runtime by kaggle_train.py
  batch_size: 4
  num_workers: 2  # Kaggle has limited CPUs

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 256
  image_size: 512
  warmup_steps: 2000
  no_im_loss_steps: 2000
  borders: image
  rnd_trans: 0.10
  rnd_trans_ramp: 20000

loss:
  message:
    scale: 1.0
    ramp_steps: 1
  message_loss_type: bce
  l2:
    scale: 2.0
    ramp_steps: 10000
  lpips:
    scale: 1.5
    ramp_steps: 10000
  use_border_falloff: false
  border_falloff_speed: 4
  l2_edge_gain: 10.0
  l2_edge_ramp_steps: 20000
  l2_edge_delay_steps: 60000
  yuv_weights: [1.0, 100.0, 100.0]
  gan_config:
    enabled: false
    discriminator_lr: 0.00001
    g_loss_scale: 1.0
    g_loss_ramp_steps: 20000
    clip_weights: 0.01
    gradient_clip: 0.25

distortion:
  strategy: curriculum
  perspective:
    strength: 0.15
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: /kaggle/working/checkpoints
  save_every_steps: 5000  # Frequent saves for 9h limit
  keep_last: 3

logging:
  backends: [console]  # No tensorboard (saves output space)
  log_every_steps: 100
  tensorboard_dir: runs
