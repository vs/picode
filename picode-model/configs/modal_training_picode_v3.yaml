# configs/modal_training_picode_v3.yaml
# Configuration for Modal GPU training with picode_v3 model
# GPU options: T4 ($0.59/hr), A10G ($1.10/hr), A100 ($3.50/hr)
#
# Picode v3: Steganography with BCH error correction
# - 127-bit BCH codewords (50-bit payload, corrects up to 13 errors)
# - Key fix: no_im_loss_steps=500 (from original StegaStamp)
#   Forces encoder-decoder to learn message encoding BEFORE adding image quality losses
#   Without this, decoder learns trivial "predict 0.5" solution (loss=0.693)

experiment_name: picode_v3_modal_v11

model: picode_v3

data:
  source: folder
  path: /data/train2017  # COCO train2017 images
  batch_size: 4  # T4 (16GB) - increase to 8 for A10G, 16 for A100
  num_workers: 4

training:
  num_steps: 100000
  lr: 0.0001
  num_bits: 127  # BCH codeword length (NOT payload size)
  image_size: 400
  warmup_steps: 500
  no_im_loss_steps: 500  # Critical: train message-only first (like StegaStamp)

loss:
  # Message loss - using MSE to avoid trivial solution (decoder outputting 0.5)
  # With BCE, predicting 0.5 gives loss=0.693, which is a local minimum for random targets
  # With MSE, predicting 0.5 gives loss=0.25, but correct predictions give loss=0
  message:
    scale: 7.0
    ramp_steps: 1
  message_loss_type: mse  # "bce" or "mse" - MSE avoids trivial solution

  # Pixel-level fidelity - ramp starts AFTER no_im_loss_steps
  l2:
    scale: 1.5
    ramp_steps: 20000

  # Perceptual similarity - ramp starts AFTER no_im_loss_steps
  lpips:
    scale: 1.0
    ramp_steps: 20000

# No distortion first to verify model learns, then add distortions
distortion:
  strategy: none

checkpoint:
  dir: /checkpoints  # Modal volume mount point
  save_every_steps: 5000  # More frequent saves for cloud
  keep_last: 5

logging:
  backends: [console, tensorboard]
  log_every_steps: 50  # More frequent logging to observe progress
  tensorboard_dir: /checkpoints/runs  # Persistent on Modal volume
