# PicodeFrame Kaggle Configuration
# Tuned for Kaggle T4 GPU (9h session limit)

experiment_name: picodeframe

model:
  type: picodeframe
  encoder_size: 400
  decoder_size: 400

data:
  source: folder
  path: ./data/train  # Overridden at runtime by kaggle_train.py
  batch_size: 4
  num_workers: 2  # Kaggle has limited CPUs

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 96
  image_size: 400
  warmup_steps: 500
  no_im_loss_steps: 500
  borders: black
  rnd_trans: 0.10
  rnd_trans_ramp: 10000

frame:
  min_frame_pct: 0.02
  max_frame_pct: 0.05
  frame_l2_scale: 2.0
  frame_l2_ramp_steps: 1
  frame_lpips_scale: 1.5
  frame_lpips_ramp_steps: 10000
  stn_reg_scale: 0.1

loss:
  message:
    scale: 7.0
    ramp_steps: 5000
  message_loss_type: bce
  gan_config:
    enabled: false

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: /kaggle/working/checkpoints
  save_every_steps: 5000  # Frequent saves for 9h limit
  keep_last: 3

logging:
  backends: [console]  # No tensorboard (saves output space)
  log_every_steps: 100
  tensorboard_dir: runs
