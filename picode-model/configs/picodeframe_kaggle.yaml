# PicodeFrame Kaggle Configuration — Fixed 3% Frame Width
# Tuned for Kaggle T4 GPU (9h session limit)
#
# v31: Narrow frame fine-tune — resume from v30 70K checkpoint at 3% (12px).
# - v30 trained at 8% (32px) reached 99.5% accuracy, 7 dB frame PSNR.
#   Frame is visible but acceptable — narrowing reduces visual footprint.
# - v30 model already gets 88.5% at 3% without retraining — good starting point.
# - Keep v30 loss values (L2=1.5, LPIPS=0.75) that the checkpoint was trained with.
# - Bump message scale 15→25 to compensate for 60% less frame area.
#
# v30: 8% frame, L2=1.5 + LPIPS=0.75, 70K steps → 99.5% accuracy.
# v29: Reduced distortions + STN-corrected border pooling.
# v28: Hybrid decoder — CNN + border-pooling branch.

experiment_name: picodeframe

model:
  type: picodeframe
  encoder_size: 400
  decoder_size: 400

data:
  source: folder
  path: ./data/train  # Overridden at runtime by kaggle_train.py
  batch_size: 4
  num_workers: 2  # Kaggle has limited CPUs

training:
  num_steps: 140000
  lr: 0.0003
  seed: 42
  num_bits: 127
  image_size: 400
  decoder_warmup_steps: 72000  # Message-only loss until step 72K (2K steps of pure bootstrap)
  warmup_steps: 74000          # No distortions until step 74K (4K steps of clean signal)
  no_im_loss_steps: 78000      # Re-enable L2/LPIPS at step 78K (8K steps of message-first)
  borders: black
  rnd_trans: 0.05
  rnd_trans_ramp: 30000       # Slow ramp — border signal needs gradual hardening
  # Collapse defense
  grad_clip_norm: 0  # Disabled — per-element clamp at 0.25 is sufficient
  lr_schedule: cosine
  lr_min_ratio: 0.1
  ema_decay: 0.999
  collapse_threshold: 0.0     # Disabled — false positives kill LR during cold-start
  collapse_recovery_cooldown: 500

frame:
  min_frame_pct: 0.03
  max_frame_pct: 0.03         # Fixed 3% = 12px at 400x400
  fixed_frame_steps: 0        # Not needed — min == max
  frame_l2_scale: 1.5         # Match v30 training — controls residual magnitude
  frame_l2_ramp_steps: 10000
  frame_lpips_scale: 0.75     # Match v30 training — perceptual quality
  frame_lpips_ramp_steps: 15000
  frame_color_scale: 0.0      # Greyscale residual architecture handles color by construction
  frame_color_ramp_steps: 10000
  stn_reg_scale: 0.1
  residual_max_amplitude: 0.0  # Disabled — let L2 loss control residual magnitude instead

loss:
  message:
    scale: 25.0               # Up from 15 — narrower frame needs stronger message gradient
    ramp_steps: 1             # No ramp — full gradient from step 0
  message_loss_type: bce       # v29 value — BCE bootstraps fine with this config
  gan_config:
    enabled: false

distortion:
  strategy: curriculum
  perspective:
    strength: 0.05              # Halved — border geometry is fragile
    ramp_steps: 30000
  brightness:
    strength: 0.2               # Mild — realistic for photo sharing
    ramp_steps: 30000
  saturation:
    strength: 0.5               # Halved — full desaturation destroys border color info
    ramp_steps: 30000
  hue:
    strength: 0.05              # Halved
    ramp_steps: 30000
  noise:
    strength: 0.01              # Halved — border pixels are few, noise impact is amplified
    ramp_steps: 30000
  contrast: [0.7, 1.3]         # Tighter range
  contrast_ramp_steps: 30000
  jpeg_quality:
    strength: 50                # Q50 not Q25 — Q25 destroys thin border patterns
    ramp_steps: 30000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: /kaggle/working/checkpoints
  save_every_steps: 5000  # Frequent saves for 9h limit
  keep_last: 3

logging:
  backends: [console]  # No tensorboard (saves output space)
  log_every_steps: 100
  tensorboard_dir: runs
