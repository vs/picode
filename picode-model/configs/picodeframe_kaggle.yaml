# PicodeFrame Kaggle Configuration — Fixed 8% Frame Width
# Tuned for Kaggle T4 GPU (9h session limit)
#
# v29: Reduced distortions + STN-corrected border pooling.
# - Border-pooling now operates on STN-corrected image (not original) so it
#   benefits from perspective correction under distortions
# - Halved distortion strengths: border-only encoding has 12x less signal area
#   than full-image stego, so full StegaStamp-strength distortions overwhelm it
# - Slower 30K ramp gives model time to build robustness gradually
# - v28 showed: 99.8% clean accuracy, then steady decline to 78% as distortions
#   ramped — the border signal was being destroyed faster than the model adapted
#
# v28: Hybrid decoder — CNN + border-pooling branch.
# v27: Revert to BCE + cosine LR + EMA defense.
# v23: Fixed 8% frame (32px at 400x400) — more pixel area for message encoding.

experiment_name: picodeframe

model:
  type: picodeframe
  encoder_size: 400
  decoder_size: 400

data:
  source: folder
  path: ./data/train  # Overridden at runtime by kaggle_train.py
  batch_size: 4
  num_workers: 2  # Kaggle has limited CPUs

training:
  num_steps: 140000
  lr: 0.0003
  seed: 42
  num_bits: 127
  image_size: 400
  decoder_warmup_steps: 1500  # Shorter — wider frame bootstraps decoder faster
  warmup_steps: 2500          # Shorter — 8% frame gives strong signal from the start
  no_im_loss_steps: 8000      # Image losses can start earlier with wider frame
  borders: black
  rnd_trans: 0.05
  rnd_trans_ramp: 30000       # Slow ramp — border signal needs gradual hardening
  # Collapse defense
  grad_clip_norm: 0  # Disabled — per-element clamp at 0.25 is sufficient
  lr_schedule: cosine
  lr_min_ratio: 0.1
  ema_decay: 0.999
  collapse_threshold: 0.05
  collapse_recovery_cooldown: 500

frame:
  min_frame_pct: 0.08
  max_frame_pct: 0.08         # Fixed 8% = 32px at 400x400
  fixed_frame_steps: 0        # Not needed — min == max
  frame_l2_scale: 0.05        # Regularization only — prevent unbounded residual (300:1 vs message)
  frame_l2_ramp_steps: 10000
  frame_lpips_scale: 0.0      # Removed — structural changes in frame are acceptable
  frame_lpips_ramp_steps: 15000
  frame_color_scale: 0.0      # Removed — greyscale residual architecture handles color by construction
  frame_color_ramp_steps: 10000
  stn_reg_scale: 0.1

loss:
  message:
    scale: 15.0               # Down from 25 — wider frame has more capacity
    ramp_steps: 1             # No ramp — full gradient from step 0
  message_loss_type: bce       # BCE has 2x stronger gradients than MSE at initialization
  gan_config:
    enabled: false

distortion:
  strategy: curriculum
  perspective:
    strength: 0.05              # Halved — border geometry is fragile
    ramp_steps: 30000
  brightness:
    strength: 0.2               # Mild — realistic for photo sharing
    ramp_steps: 30000
  saturation:
    strength: 0.5               # Halved — full desaturation destroys border color info
    ramp_steps: 30000
  hue:
    strength: 0.05              # Halved
    ramp_steps: 30000
  noise:
    strength: 0.01              # Halved — border pixels are few, noise impact is amplified
    ramp_steps: 30000
  contrast: [0.7, 1.3]         # Tighter range
  contrast_ramp_steps: 30000
  jpeg_quality:
    strength: 50                # Q50 not Q25 — Q25 destroys thin border patterns
    ramp_steps: 30000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: /kaggle/working/checkpoints
  save_every_steps: 5000  # Frequent saves for 9h limit
  keep_last: 3

logging:
  backends: [console]  # No tensorboard (saves output space)
  log_every_steps: 100
  tensorboard_dir: runs
