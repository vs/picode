database:
  # URL set via environment variable PICODE_DATABASE__URL
  url: postgresql://picode:picode@localhost:5432/picode_scraper
  pool_size: 5

storage:
  backend: local
  local_path: /data/images

scraping:
  user_agent: "PicodeDatasetCollector/1.0 (research; +https://github.com/picode)"
  request_delay: 1.0
  max_retries: 3
  timeout: 30
  proxy_url: null
  proxy_rotation: false

validation:
  min_image_size: 256
  min_corner_confidence: 0.7
  min_coverage: 0.1
  min_similarity: 0.6
  proxy_resolution: 800
