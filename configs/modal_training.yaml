# configs/modal_training.yaml
# Configuration optimized for Modal A10G GPU (24GB VRAM)

experiment_name: picode_modal

data:
  source: folder
  path: /data  # Modal volume mount point
  batch_size: 8  # A10G can handle larger batches
  num_workers: 4

training:
  num_steps: 140000
  lr: 0.0001
  num_bits: 100
  image_size: 400
  warmup_steps: 500

loss:
  message:
    scale: 1.0
    ramp_steps: 1
  l2:
    scale: 1.5
    ramp_steps: 20000
  lpips:
    scale: 1.0
    ramp_steps: 20000
  l2_edge_gain: 10.0
  l2_edge_ramp_steps: 20000
  l2_edge_delay_steps: 60000
  yuv_weights: [1.0, 1.0, 1.0]

distortion:
  strategy: curriculum
  perspective:
    strength: 0.1
    ramp_steps: 10000
  brightness:
    strength: 0.3
    ramp_steps: 1000
  saturation:
    strength: 1.0
    ramp_steps: 1000
  hue:
    strength: 0.1
    ramp_steps: 1000
  noise:
    strength: 0.02
    ramp_steps: 1000
  contrast: [0.5, 1.5]
  contrast_ramp_steps: 1000
  jpeg_quality:
    strength: 25
    ramp_steps: 1000
  enable_jpeg: true
  enable_blur: true

checkpoint:
  dir: /checkpoints  # Modal volume mount point
  save_every_steps: 5000  # More frequent saves for cloud
  keep_last: 5

logging:
  backends: [console, tensorboard]
  log_every_steps: 50  # More frequent logging to observe progress
  tensorboard_dir: /checkpoints/runs  # Persistent on Modal volume
