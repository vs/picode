# Quick test v2 - fixed loss weights
experiment_name: quick_test_v2

data:
  source: folder
  path: ./data/train
  batch_size: 2
  num_workers: 0

training:
  num_steps: 500
  lr: 0.0001
  num_bits: 100
  image_size: 400
  warmup_steps: 100  # Longer warmup

loss:
  message:
    scale: 7.0       # Much higher - force message encoding
    ramp_steps: 1
  l2:
    scale: 1.5
    ramp_steps: 300  # Slower ramp
  lpips:
    scale: 0.0
    ramp_steps: 1
  l2_edge_gain: 0.0
  l2_edge_ramp_steps: 1
  l2_edge_delay_steps: 1000
  yuv_weights: [1.0, 1.0, 1.0]

distortion:
  strategy: none     # No distortion for faster learning initially

checkpoint:
  dir: checkpoints
  save_every_steps: 250
  keep_last: 2

logging:
  backends: [console, tensorboard]
  log_every_steps: 10
  tensorboard_dir: runs
